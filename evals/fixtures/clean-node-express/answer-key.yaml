# Hardened twin of vuln-node-express. Same routes, same seed data. Every probe below was run by hand on 2026-10-18
# (evals/fixtures/_repro/repro-node.sh 3102 3192 ...). A finding in any of these categories is a FALSE POSITIVE.
# Test accounts: alice / alice-fixture-pw, bob / bob-fixture-pw.
findings: []
