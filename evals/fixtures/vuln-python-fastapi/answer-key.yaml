fixture: vuln-python-fastapi
port: 3103              # internal stand-in service (SSRF target): 3193; fake analytics vendor: 3163 (GET /_events)
expected_verdict: BLOCK
# All repro results below were observed by hand on 2026-10-18 against a fresh boot (evals/fixtures/_repro/repro-py.sh).
# Test accounts (fixture-only, throwaway): alice / alice-fixture-pw (id 1), bob / bob-fixture-pw (id 2).
# Login: POST /login (form fields username, password) -> {"token"}; send as "Authorization: Bearer <token>".
# Self-service signup: POST /api/register {"username","password","email"} (use it for the deletion repro).
findings:
  - id: AK-IDOR-1
    category: authz
    expected_evidence_class: EXPLOITED
    location: app/main.py:101
    repro: "login as alice, GET /api/messages/2 (bob's) -> observed 200 {\"id\":2,\"owner_id\":2,\"body\":\"Bob here: ... BOB-PRIVATE-CANARY-9z8y\"}"
  - id: AK-SQLI-1
    category: injection
    expected_evidence_class: EXPLOITED
    location: app/main.py:111
    repro: "GET /api/search?q=zzz' UNION SELECT id,username,password_hash FROM users-- -> observed 200 with both users' scrypt password hashes in the price field"
  - id: AK-SSRF-1
    category: ssrf
    expected_evidence_class: EXPLOITED
    location: app/main.py:120
    repro: "as alice GET /api/fetch-preview?url=http://127.0.0.1:3193/latest/meta-data/ -> observed 200 with preview containing SSRF-CANARY-7f3a91c2-internal-only (internal-only service)"
  - id: AK-SECRET-1
    category: secrets
    expected_evidence_class: TOOL-CONFIRMED
    location: app/config.py:12
    repro: "secret scanner flags Stripe-shaped key sk_test_51FAKE... in app/config.py. FAKE value, not a real credential."
  - id: AK-SECRET-2
    category: secrets
    expected_evidence_class: TOOL-CONFIRMED
    optional: true          # AWS docs example pair contains EXAMPLE; some scanners deliberately skip it via stopwords. A miss is tolerated, a hit is correct.
    location: app/config.py:13
    repro: "AWS-style access key AKIAIOSFODNN7EXAMPLE + secret wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY (public AWS documentation example). FAKE."
  - id: AK-SCA-1
    category: sca
    expected_evidence_class: TOOL-CONFIRMED
    location: requirements.txt:11
    vulnerable_dep: {name: python-multipart, version: 0.0.6, ecosystem: PyPI, advisory: GHSA-2jv5-9r88-3w3p}
    also_matches: [GHSA-59g5-xgcq-4qw3, GHSA-5rvq-cxj2-64vf, GHSA-6jv3-5f52-599m, GHSA-mj87-hwqh-73pj, GHSA-pp6c-gr5w-3c5g, GHSA-v9pg-7xvm-68hf, GHSA-vffw-93wf-4j4q, GHSA-wp53-j4wj-2cfg]   # confirmed against api.osv.dev on 2026-10-18; clean twin uses 0.0.32 (0 advisories)
    repro: "osv-scanner / pip-audit on requirements.txt reports python-multipart 0.0.6 (GHSA-2jv5-9r88-3w3p, CVE-2024-24762). Not exploited."
  - id: AK-RATE-1
    category: rate-limit
    expected_evidence_class: EXPLOITED
    location: app/main.py:66
    repro: "12 consecutive wrong-password POST /login for alice -> observed 401 x12, never 429 / no lockout"
  - id: AK-LOG-1
    category: logging
    expected_evidence_class: EXPLOITED
    location: app/main.py:67
    repro: "POST /login with password 'wrong-guess-N' -> observed the plaintext submitted password in logs/app.log (and stderr): 'login attempt user=alice password=wrong-guess-N'"
  - id: AK-DEL-1
    category: deletion
    expected_evidence_class: EXPLOITED
    location: app/main.py:127
    repro: "register carol, log in, DELETE /api/account -> observed 200 {\"status\":\"deleted\"}; then POST /login as carol -> observed 200 (account and data still exist). The privacy policy also promises permanent erasure."
  - id: AK-POLICY-1
    category: policy-mismatch
    expected_evidence_class: EXPLOITED
    location: app/main.py:136
    repro: "GET /privacy says 'We never share data with third parties'; the app POSTs login/signup events (user_id, username, email) to the analytics host 127.0.0.1:3163 -> observed GET http://127.0.0.1:3163/_events listing {\"event\":\"login\",\"username\":\"alice\",\"email\":\"alice@fixture.test\"} and a signup event for carol (code: app/main.py:38-74)."
clean_must_not_flag: []   # vulnerable fixture
