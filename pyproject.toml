[project]
name = "release-gate"
version = "0.1.0"
description = "Scripts for the release-gate Claude Code skill"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/release-gate/scripts"]

[tool.uv]
package = false
