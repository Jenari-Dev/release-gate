lawyer_questions:
  - "Do we handle personal information of people in Japan in connection with supplying goods or services, bringing us within Art. 171?"
  - "Which of our recipients are entrusted processors and which are third parties for Art. 27?"
  - "Is any of our data sensitive personal information, and how is consent collected?"
  - "What current PPC guidelines apply to our cross-border transfers and to children's data?"
