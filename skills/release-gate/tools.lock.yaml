# release-gate pinned tool set (session 1/2). Read by check_tools.py and install_tools.py.
# Every version is an exact pin, at least 2 weeks old as of 2026-10-18.
# Binary sha256 values come from each project's official published checksums file
# (checksums_url); install_tools.py verifies them before extracting anything.
schema_version: 1
install_dir: ~/.local/share/release-gate/bin
venv_dir: ~/.local/share/release-gate/venv
venv_python: "3.12"          # uv-managed CPython; semgrep/checkov are validated on 3.12, not 3.14
share_dir: ~/.local/share/release-gate          # larger payloads (ZAP, nuclei templates, semgrep rules, node) live here, never in the repo
tools:
  gitleaks:
    kind: binary
    version: "8.30.1"
    category: secrets
    version_cmd: ["gitleaks", "version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    checksums_url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
    archive_member: gitleaks
  trufflehog:
    kind: binary
    version: "3.97.9"
    category: secrets
    version_cmd: ["trufflehog", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_linux_amd64.tar.gz
    sha256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
    checksums_url: https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_checksums.txt
    archive_member: trufflehog
  osv-scanner:
    kind: binary
    version: "2.6.0"
    category: sca
    version_cmd: ["osv-scanner", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
    sha256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    checksums_url: https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_SHA256SUMS
    # release asset is the bare executable (no archive), so no archive_member
  trivy:
    kind: binary
    version: "0.75.0"
    category: sca
    version_cmd: ["trivy", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
    sha256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    checksums_url: https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt
    archive_member: trivy
  syft:
    kind: binary
    version: "1.54.0"
    category: sbom
    version_cmd: ["syft", "version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/anchore/syft/releases/download/v1.54.0/syft_1.54.0_linux_amd64.tar.gz
    sha256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
    checksums_url: https://github.com/anchore/syft/releases/download/v1.54.0/syft_1.54.0_checksums.txt
    archive_member: syft
  hadolint:
    kind: binary
    version: "2.15.1"
    category: iac
    version_cmd: ["hadolint", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
    sha256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    checksums_url: https://github.com/hadolint/hadolint/releases/download/v2.15.1/checksums.sha256
    # release asset is the bare executable (no archive), so no archive_member
  semgrep:
    kind: pip
    version: "1.179.0"
    category: sast
    package: semgrep
    version_cmd: ["semgrep", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
  bandit:
    kind: pip
    version: "1.9.4"
    category: sast
    package: bandit
    version_cmd: ["bandit", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
  pip-audit:
    kind: pip
    version: "2.10.1"
    category: sca
    package: pip-audit
    version_cmd: ["pip-audit", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
  checkov:
    kind: pip
    version: "3.3.22"
    category: iac
    package: checkov
    version_cmd: ["checkov", "--version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
  nuclei:
    kind: binary
    version: "3.11.1"
    category: dast
    version_cmd: ["nuclei", "-version"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
    source: https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
    sha256: ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
    checksums_url: https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_checksums.txt
    archive_member: nuclei
  zap:
    kind: archive-dir
    version: "2.17.0"
    category: dast
    # ZAP needs a JRE; this box has OpenJDK 21. ZAP is only used for the non-critical SEC-DAST check.
    source: https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
    sha256: efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a
    # ZAP lists SHA-256 only in its release-notes table, not a checksums file; the pin above also
    # matches GitHub's published asset digest. The downloaded file is still verified against it.
    checksum_source: computed-local
    install_root: zap
    verify_path: zap/ZAP_2.17.0/zap.sh
    exe_rel: zap/ZAP_2.17.0/zap.sh
    version_cmd: ["zap.sh", "-version", "-cmd"]
    version_regex: "(\\d+\\.\\d+\\.\\d+)"
  nuclei-templates:
    kind: git
    version: "v10.4.9"
    category: dast
    # Integrity pin is the commit sha, verified after checkout. MIT-licensed, so safe to redistribute,
    # but still fetched at install time (pinned), never committed to this repo.
    source: https://github.com/projectdiscovery/nuclei-templates.git
    commit: 893122ffce8ebf8e264f15d2cd3960cb1dd36d6c
    license: MIT
    install_root: nuclei-templates
    verify_path: nuclei-templates/.nuclei-ignore
  semgrep-rules:
    kind: git
    version: "a84ff9c"
    category: sast
    # Resolves open issue #1: semgrep --config p/default fetches rules from the registry at runtime.
    # Instead we pin this snapshot (verified by commit sha) and run semgrep --config <local> --metrics off.
    # License: "Semgrep Rules License v1.0" (semgrep.dev/legal/rules-license) — NOT redistributed in this
    # repo; fetched at install time into share_dir and git-ignored. Reviewed before use as untrusted data.
    source: https://github.com/semgrep/semgrep-rules.git
    commit: a84ff9cc2453ca91d581380de4b8b3f272f6f4be
    license: "Semgrep Rules License v1.0"
    install_root: semgrep-rules
    verify_path: semgrep-rules/README.md
  playwright:
    kind: npm
    version: "1.63.0"
    category: privacy
    # Drives cookie_audit.mjs. Installed into share_dir/node with its pinned Chromium; both fetched at
    # install time. npm resolves transitive deps itself (not hash-pinned), same policy as the pip tools.
    package: playwright
    install_root: node
    browser: chromium
    verify_path: node/node_modules/playwright/package.json
